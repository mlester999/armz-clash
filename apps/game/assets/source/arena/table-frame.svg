      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="50%" stop-color="#2a3038"/>
      <stop offset="100%" stop-color="#1a2028"/>
    </linearGradient>
    <linearGradient id="ar-tf-leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5058"/>
      <stop offset="50%" stop-color="#3a4048"/>
