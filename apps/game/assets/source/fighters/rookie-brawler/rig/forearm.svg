<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 200" width="80" height="200">
  <defs>
    <linearGradient id="rb-farm-skin" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#d4956e"/>
      <stop offset="50%" stop-color="#c48a6a"/>
      <stop offset="100%" stop-color="#a87050"/>
    </linearGradient>
    <linearGradient id="rb-farm-flexor" x1="0.1" y1="0" x2="0.9" y2="0.5">
      <stop offset="0%" stop-color="#daa882" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c48a6a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rb-farm-extensor-shadow" x1="0.9" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7a4a30" stop-opacity="0"/>
      <stop offset="70%" stop-color="#6b3f28" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a3020" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="rb-farm-tex">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Forearm mass - flexor/extensor anatomy -->
  <path d="M18 5 C10 15 6 40 8 70 C10 100 14 135 20 165 C24 180 32 192 42 196 C52 192 60 180 64 165 C70 135 74 100 76 70 C78 40 74 15 66 5 C56 0 48 -2 42 -2 C36 -2 28 0 18 5Z" fill="url(#rb-farm-skin)" filter="url(#rb-farm-tex)"/>
  <!-- Flexor mass bulge -->
  <path d="M14 25 C18 15 28 8 40 6 C48 8 54 15 56 28 C58 45 56 70 52 95 C48 75 42 50 38 35 C34 22 24 20 14 25Z" fill="url(#rb-farm-flexor)"/>
  <!-- Extensor shadow -->
  <path d="M66 15 C72 30 76 55 76 80 C76 110 72 140 66 165 C70 140 72 110 72 80 C72 55 70 30 66 15Z" fill="url(#rb-farm-extensor-shadow)"/>
  <!-- Muscle separation -->
  <path d="M55 10 C60 30 62 60 62 90 C62 120 60 150 55 175" fill="none" stroke="#8a5535" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Forearm striations -->
  <path d="M25 35 C30 32 36 34 38 40 M24 55 C29 52 35 54 37 60 M26 75 C31 72 37 74 39 80 M28 95 C33 92 39 94 41 100" fill="none" stroke="#a06b4a" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>
  <!-- Vein -->
  <path d="M30 20 C28 45 29 75 31 105 C32 125 31 150 29 175" fill="none" stroke="#7a5540" stroke-width="1.5" stroke-opacity="0.18" stroke-linecap="round"/>
  <!-- Rim light -->
  <path d="M18 5 C10 15 6 40 8 70 C10 100 14 135 20 165" fill="none" stroke="#f0d8b8" stroke-width="1.5" stroke-opacity="0.25" stroke-linecap="round"/>
</svg>
