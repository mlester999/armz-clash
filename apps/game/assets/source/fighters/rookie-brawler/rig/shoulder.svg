<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="rb-shoulder-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4956e"/>
      <stop offset="45%" stop-color="#c48a6a"/>
      <stop offset="100%" stop-color="#a06b4a"/>
    </linearGradient>
    <linearGradient id="rb-shoulder-shadow" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8a5535" stop-opacity="0"/>
      <stop offset="70%" stop-color="#6b3f28" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a2a18" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="rb-shoulder-highlight" cx="0.35" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#f0c8a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f0c8a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rb-shoulder-cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3828"/>
      <stop offset="100%" stop-color="#2d2118"/>
    </linearGradient>
    <filter id="rb-shoulder-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="overlay" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Deltoid mass - main shoulder shape -->
  <path d="M25 130 C18 105 15 75 22 50 C28 32 42 18 62 12 C82 6 100 14 108 32 C116 50 118 78 112 105 C108 122 100 134 88 138 L42 140 C32 138 27 135 25 130Z" fill="url(#rb-shoulder-skin)" filter="url(#rb-shoulder-texture)"/>
  <!-- Deltoid separation line -->
  <path d="M62 14 C58 35 55 60 56 85 C57 105 60 120 64 135" fill="none" stroke="#8a5535" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Anterior deltoid bulge -->
  <path d="M30 55 C35 38 48 25 65 20 C78 16 90 22 96 35 C100 44 100 58 96 72 C90 60 78 48 62 45 C46 42 35 47 30 55Z" fill="url(#rb-shoulder-highlight)"/>
  <!-- Posterior shadow -->
  <path d="M88 40 C100 55 106 78 108 100 C110 118 105 132 95 138 L88 138 C96 125 100 105 98 82 C96 60 92 45 88 40Z" fill="url(#rb-shoulder-shadow)"/>
  <!-- Trapezius connection -->
  <path d="M25 130 C20 118 18 100 22 82 C15 90 10 105 12 120 C14 132 20 138 28 140 L42 140 C34 138 28 135 25 130Z" fill="#a06b4a" fill-opacity="0.6"/>
  <!-- Cloth strap over shoulder -->
  <path d="M35 22 C45 15 58 11 72 12 C78 12 84 14 88 18 L84 28 C78 24 70 22 62 22 C50 22 40 26 35 32Z" fill="url(#rb-shoulder-cloth)"/>
  <path d="M37 24 C46 18 57 15 68 15" fill="none" stroke="#5a4535" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Stitch detail on strap -->
  <path d="M40 20 L42 26 M48 17 L50 23 M56 15 L58 21 M64 14 L66 20 M72 15 L74 21 M80 17 L82 23" stroke="#6b5540" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Skin texture pores -->
  <path d="M45 60 C46 58 48 58 49 60 M55 50 C56 48 58 48 59 50 M65 55 C66 53 68 53 69 55 M50 75 C51 73 53 73 54 75 M70 70 C71 68 73 68 74 70" stroke="#8a5535" stroke-width="0.8" stroke-opacity="0.25" fill="none" stroke-linecap="round"/>
  <!-- Edge rim light -->
  <path d="M22 50 C28 32 42 18 62 12 C82 6 100 14 108 32" fill="none" stroke="#f0d8b8" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
</svg>
