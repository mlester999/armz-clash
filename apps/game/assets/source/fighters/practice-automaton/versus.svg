<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#060d14"/>
    </linearGradient>
    <linearGradient id="pav-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9aaa"/>
      <stop offset="40%" stop-color="#6a7a8a"/>
      <stop offset="100%" stop-color="#4a5a6a"/>
    </linearGradient>
    <linearGradient id="pav-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5a"/>
      <stop offset="100%" stop-color="#2a3a4a"/>
    </linearGradient>
    <radialGradient id="pav-eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5ec8ff"/>
      <stop offset="60%" stop-color="#3aa0dd"/>
      <stop offset="100%" stop-color="#2a7ab0"/>
    </radialGradient>
    <linearGradient id="pav-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ec8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pav-brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.4" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="overlay" result="t"/>
      <feComposite in="t" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Background -->
  <path d="M0 0 L400 0 L400 300 L0 300Z" fill="url(#pav-bg)"/>
  <!-- Diagonal energy lines -->
  <path d="M0 200 L150 0 M50 300 L250 0 M300 300 L400 100" stroke="#5ec8ff" stroke-width="1" stroke-opacity="0.08"/>
  <!-- Body torso - 3/4 view -->
  <path d="M140 120 C130 130 125 145 125 165 L125 240 C125 255 130 265 140 272 L160 282 L260 282 L280 272 C290 265 295 255 295 240 L295 165 C295 145 290 130 280 120 L255 108 L165 108Z" fill="url(#pav-metal)" filter="url(#pav-brush)"/>
  <!-- Chest plate -->
  <path d="M150 125 L270 125 L275 135 L275 210 L270 220 L150 220 L145 210 L145 135Z" fill="url(#pav-dark)"/>
  <!-- Chest core reactor -->
  <path d="M190 150 L230 150 L238 172 L230 194 L190 194 L182 172Z" fill="#1a2a3a"/>
  <path d="M196 156 L224 156 L230 172 L224 188 L196 188 L190 172Z" fill="#5ec8ff" fill-opacity="0.15"/>
  <path d="M202 162 L218 162 L222 172 L218 182 L202 182 L198 172Z" fill="#5ec8ff" fill-opacity="0.35"/>
  <path d="M207 167 L213 167 L215 172 L213 177 L207 177 L205 172Z" fill="#5ec8ff" fill-opacity="0.6"/>
  <!-- Chest panel lines -->
  <path d="M150 160 L182 160 M238 160 L270 160" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M150 185 L182 185 M238 185 L270 185" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Shoulder mounts -->
  <path d="M120 115 C110 118 105 125 105 135 L105 165 C105 175 110 182 120 185 L140 185 L140 115Z" fill="url(#pav-metal)"/>
  <path d="M300 115 C310 118 315 125 315 135 L315 165 C315 175 310 182 300 185 L280 185 L280 115Z" fill="url(#pav-metal)"/>
  <!-- Shoulder rivets -->
  <path d="M112 130 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0" fill="#7a8a98"/>
  <path d="M112 160 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0" fill="#7a8a98"/>
  <path d="M302 130 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0" fill="#7a8a98"/>
  <path d="M302 160 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0" fill="#7a8a98"/>
  <!-- Head -->
  <path d="M175 50 C168 56 164 66 164 78 L164 100 C164 108 168 114 175 118 L185 124 L235 124 L245 118 C252 114 256 108 256 100 L256 78 C256 66 252 56 245 50 L232 44 L188 44Z" fill="url(#pav-metal)" filter="url(#pav-brush)"/>
  <!-- Head crest -->
  <path d="M182 46 C186 40 196 36 210 36 C224 36 234 40 238 46 L240 50 L180 50Z" fill="url(#pav-dark)"/>
  <path d="M190 42 L230 42" stroke="#5ec8ff" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Visor -->
  <path d="M172 62 L248 62 L252 70 L252 92 L248 100 L172 100 L168 92 L168 70Z" fill="#1a2a3a"/>
  <!-- Eyes -->
  <path d="M182 72 C182 68 186 65 192 65 C198 65 202 68 202 72 L202 88 C202 92 198 95 192 95 C186 95 182 92 182 88Z" fill="url(#pav-eye)"/>
  <path d="M218 72 C218 68 222 65 228 65 C234 65 238 68 238 72 L238 88 C238 92 234 95 228 95 C222 95 218 92 218 88Z" fill="url(#pav-eye)"/>
  <!-- Eye inner glow -->
  <path d="M186 74 C186 72 188 70 192 70 C196 70 198 72 198 74 L198 82 C198 84 196 86 192 86 C188 86 186 84 186 82Z" fill="#a0e8ff" fill-opacity="0.5"/>
  <path d="M222 74 C222 72 224 70 228 70 C232 70 234 72 234 74 L234 82 C234 84 232 86 228 86 C224 86 222 84 222 82Z" fill="#a0e8ff" fill-opacity="0.5"/>
  <!-- Mouth grille -->
  <path d="M190 104 L230 104 L232 108 L232 116 L230 118 L190 118 L188 116 L188 108Z" fill="#1a2a3a"/>
  <path d="M194 108 L226 108 M194 112 L226 112" stroke="#3a4a5a" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Antenna -->
  <path d="M207 36 L207 26 C207 23 209 21 210 21 C211 21 213 23 213 26 L213 36" fill="none" stroke="#6a7a8a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M208 23 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#5ec8ff"/>
  <!-- Arms raised in fighting stance -->
  <path d="M105 140 C95 145 88 155 85 170 L80 200 C78 210 82 218 90 222 L100 225 L115 220 L118 195 L120 170 C120 158 115 148 108 142Z" fill="url(#pav-metal)"/>
  <path d="M315 140 C325 145 332 155 335 170 L340 200 C342 210 338 218 330 222 L320 225 L305 220 L302 195 L300 170 C300 158 305 148 312 142Z" fill="url(#pav-metal)"/>
  <!-- Forearm detail -->
  <path d="M88 175 L112 175" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M86 195 L114 195" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M308 175 L332 175" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M306 195 L334 195" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Cyan power lines on arms -->
  <path d="M92 155 L92 210" stroke="#5ec8ff" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M328 155 L328 210" stroke="#5ec8ff" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Fist shapes -->
  <path d="M78 218 C74 222 72 228 72 235 C72 242 74 248 78 252 L92 258 L108 258 L118 252 C122 248 124 242 124 235 C124 228 122 222 118 218 L108 214 L88 214Z" fill="url(#pav-metal)"/>
  <path d="M302 218 C298 222 296 228 296 235 C296 242 298 248 302 252 L312 258 L328 258 L338 252 C342 248 344 242 344 235 C344 228 342 222 338 218 L328 214 L312 214Z" fill="url(#pav-metal)"/>
  <!-- Fist knuckle lines -->
  <path d="M82 230 L114 230 M82 240 L114 240" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M306 230 L334 230 M306 240 L334 240" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Waist / hip section -->
  <path d="M155 270 L265 270 L270 280 L270 300 L150 300 L150 280Z" fill="url(#pav-dark)"/>
  <path d="M165 275 L255 275" stroke="#5ec8ff" stroke-width="1.5" stroke-opacity="0.2" stroke-linecap="round"/>
  <!-- Edge rim light -->
  <path d="M140 120 C130 130 125 145 125 165 L125 240" fill="none" stroke="#b0c8e0" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>
  <!-- Cyan accent under chin -->
  <path d="M172 102 L248 102" stroke="url(#pav-cyan)" stroke-width="2"/>
</svg>
