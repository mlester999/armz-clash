<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="pap-bg" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </radialGradient>
    <linearGradient id="pap-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9aaa"/>
      <stop offset="40%" stop-color="#6a7a8a"/>
      <stop offset="100%" stop-color="#4a5a6a"/>
    </linearGradient>
    <linearGradient id="pap-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5a"/>
      <stop offset="100%" stop-color="#2a3a4a"/>
    </linearGradient>
    <radialGradient id="pap-eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5ec8ff"/>
      <stop offset="60%" stop-color="#3aa0dd"/>
      <stop offset="100%" stop-color="#2a7ab0"/>
    </radialGradient>
    <linearGradient id="pap-cyan-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ec8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pap-brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.4" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="overlay" result="t"/>
      <feComposite in="t" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Background -->
  <path d="M0 0 L256 0 L256 256 L0 256Z" fill="url(#pap-bg)"/>
  <!-- Subtle grid pattern -->
  <path d="M0 64 L256 64 M0 128 L256 128 M0 192 L256 192 M64 0 L64 256 M128 0 L128 256 M192 0 L192 256" stroke="#1a2a3a" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Head housing - main chassis -->
  <path d="M78 60 C68 68 62 82 62 100 L62 160 C62 178 68 192 78 200 L92 210 L164 210 L178 200 C188 192 194 178 194 160 L194 100 C194 82 188 68 178 60 L158 50 L98 50Z" fill="url(#pap-metal)" filter="url(#pap-brush)"/>
  <!-- Top crest plate -->
  <path d="M88 52 C92 44 104 38 128 38 C152 38 164 44 168 52 L172 58 L84 58Z" fill="url(#pap-dark)"/>
  <path d="M96 46 L160 46" stroke="#5ec8ff" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Face plate -->
  <path d="M82 72 L174 72 L178 80 L178 155 L174 163 L82 163 L78 155 L78 80Z" fill="url(#pap-dark)"/>
  <!-- Visor / eye band -->
  <path d="M86 90 L170 90 L174 100 L174 120 L170 130 L86 130 L82 120 L82 100Z" fill="#1a2a3a"/>
  <!-- Left eye -->
  <path d="M96 100 C96 94 102 90 110 90 C118 90 124 94 124 100 L124 118 C124 124 118 128 110 128 C102 128 96 124 96 118Z" fill="url(#pap-eye)"/>
  <path d="M102 98 C102 95 105 93 110 93 C115 93 118 95 118 98 L118 106 C118 109 115 111 110 111 C105 111 102 109 102 106Z" fill="#a0e8ff" fill-opacity="0.6"/>
  <!-- Right eye -->
  <path d="M132 100 C132 94 138 90 146 90 C154 90 160 94 160 100 L160 118 C160 124 154 128 146 128 C138 128 132 124 132 118Z" fill="url(#pap-eye)"/>
  <path d="M138 98 C138 95 141 93 146 93 C151 93 154 95 154 98 L154 106 C154 109 151 111 146 111 C141 111 138 109 138 106Z" fill="#a0e8ff" fill-opacity="0.6"/>
  <!-- Eye glow halos -->
  <path d="M92 96 C92 88 100 82 110 82 C120 82 128 88 128 96" fill="none" stroke="#5ec8ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <path d="M128 96 C128 88 136 82 146 82 C156 82 164 88 164 96" fill="none" stroke="#5ec8ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Mouth grille -->
  <path d="M100 140 L156 140 L158 145 L158 155 L156 158 L100 158 L98 155 L98 145Z" fill="#1a2a3a"/>
  <path d="M104 144 L152 144 M104 148 L152 148 M104 152 L152 152" stroke="#3a4a5a" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Side panels -->
  <path d="M62 90 L78 90 L78 140 L62 140 C58 135 56 125 56 115 C56 105 58 95 62 90Z" fill="url(#pap-dark)"/>
  <path d="M194 90 L178 90 L178 140 L194 140 C198 135 200 125 200 115 C200 105 198 95 194 90Z" fill="url(#pap-dark)"/>
  <!-- Side vents -->
  <path d="M64 100 L74 100 M64 108 L74 108 M64 116 L74 116 M64 124 L74 124" stroke="#5ec8ff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M182 100 L192 100 M182 108 L192 108 M182 116 L192 116 M182 124 L192 124" stroke="#5ec8ff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Neck / shoulder mount hint -->
  <path d="M92 210 L164 210 L170 220 L174 240 L82 240 L86 220Z" fill="url(#pap-dark)"/>
  <path d="M100 215 L156 215" stroke="#5ec8ff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Shoulder bolts -->
  <path d="M90 225 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" fill="#5a6a7a"/>
  <path d="M158 225 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" fill="#5a6a7a"/>
  <!-- Panel seams -->
  <path d="M82 72 L174 72" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M82 163 L174 163" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Rivets -->
  <path d="M84 76 a2.5 2.5 0 1 0 5 0 a2.5 2.5 0 1 0 -5 0" fill="#7a8a98"/>
  <path d="M167 76 a2.5 2.5 0 1 0 5 0 a2.5 2.5 0 1 0 -5 0" fill="#7a8a98"/>
  <path d="M84 157 a2.5 2.5 0 1 0 5 0 a2.5 2.5 0 1 0 -5 0" fill="#7a8a98"/>
  <path d="M167 157 a2.5 2.5 0 1 0 5 0 a2.5 2.5 0 1 0 -5 0" fill="#7a8a98"/>
  <!-- Antenna nub -->
  <path d="M124 38 L124 28 C124 24 126 22 128 22 C130 22 132 24 132 28 L132 38" fill="none" stroke="#6a7a8a" stroke-width="3" stroke-linecap="round"/>
  <path d="M126 24 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#5ec8ff"/>
  <!-- Edge rim light -->
  <path d="M78 60 C68 68 62 82 62 100 L62 160" fill="none" stroke="#b0c8e0" stroke-width="2" stroke-opacity="0.25" stroke-linecap="round"/>
  <!-- Specular highlight -->
  <path d="M95 55 C100 50 112 46 128 46" fill="none" stroke="#e0f0ff" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>
  <!-- Cyan accent line under visor -->
  <path d="M86 132 L170 132" stroke="url(#pap-cyan-line)" stroke-width="2"/>
</svg>
