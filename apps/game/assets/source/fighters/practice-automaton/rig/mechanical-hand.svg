<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <defs>
    <linearGradient id="pa-mh-palm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9aaa"/>
      <stop offset="40%" stop-color="#6a7a8a"/>
      <stop offset="100%" stop-color="#4a5a6a"/>
    </linearGradient>
    <radialGradient id="pa-mh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pa-mh-brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.5" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="overlay" result="t"/>
      <feComposite in="t" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Palm chassis -->
  <path d="M18 12 C12 16 8 24 8 34 L8 72 C8 84 12 94 20 100 L28 106 L72 106 L80 100 C88 94 92 84 92 72 L92 34 C92 24 88 16 82 12 L64 6 L36 6Z" fill="url(#pa-mh-palm)" filter="url(#pa-mh-brush)"/>
  <!-- Palm plate segmentation -->
  <path d="M14 30 L86 30" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M14 78 L86 78" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M50 30 L50 78" stroke="#2a3a4a" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Central grip sensor -->
  <path d="M38 42 L62 42 L66 54 L62 66 L38 66 L34 54Z" fill="#3a4a5a"/>
  <path d="M42 46 L58 46 L61 54 L58 62 L42 62 L39 54Z" fill="url(#pa-mh-glow)"/>
  <path d="M46 50 L54 50 L56 54 L54 58 L46 58 L44 54Z" fill="#5ec8ff" fill-opacity="0.5"/>
  <!-- Finger mount knuckles (top edge) -->
  <path d="M16 12 C16 8 20 5 26 5 L34 5 C38 5 40 7 40 10 L40 14 L16 14Z" fill="#5a6a7a"/>
  <path d="M42 10 C42 6 46 3 52 3 L60 3 C64 3 66 5 66 8 L66 12 L42 12Z" fill="#5a6a7a"/>
  <path d="M68 12 C68 8 72 5 78 5 L84 5 C88 5 90 7 90 10 L90 14 L68 14Z" fill="#5a6a7a"/>
  <!-- Knuckle bolts -->
  <path d="M24 9 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#8a9aaa"/>
  <path d="M50 7 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#8a9aaa"/>
  <path d="M76 9 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#8a9aaa"/>
  <!-- Thumb clamp mount (left side) -->
  <path d="M8 40 C4 42 2 46 2 52 L2 64 C2 70 4 74 8 76 L12 76 L12 40Z" fill="#5a6a7a"/>
  <path d="M6 48 L10 48 M6 60 L10 60" stroke="#2a3a4a" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Wrist connection (bottom) -->
  <path d="M28 106 L72 106 L68 110 L32 110Z" fill="#4a5a6a"/>
  <!-- Rivets -->
  <path d="M14 36 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#7a8a98"/>
  <path d="M82 36 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#7a8a98"/>
  <path d="M14 72 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#7a8a98"/>
  <path d="M82 72 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="#7a8a98"/>
  <!-- Wear and scuff marks -->
  <path d="M25 55 L32 53 M68 60 L76 58 M30 88 L38 86" stroke="#2a3a4a" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Edge rim light -->
  <path d="M18 12 C12 16 8 24 8 34 L8 72" fill="none" stroke="#b0c8e0" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Specular highlight -->
  <path d="M30 14 L30 100" stroke="#c0d8f0" stroke-width="4" stroke-opacity="0.1" stroke-linecap="round"/>
</svg>
