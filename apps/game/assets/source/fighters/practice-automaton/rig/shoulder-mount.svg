  <path d="M105 45 C106 43 109 43 110 45 C111 47 109 49 107 49 C105 49 104 47 105 45Z" fill="#9aaaba"/>
  <path d="M28 110 C29 108 32 108 33 110 C34 112 32 114 30 114 C28 114 27 112 28 110Z" fill="#9aaaba"/>
  <path d="M108 105 C109 103 112 103 113 105 C114 107 112 109 110 109 C108 109 107 107 108 105Z" fill="#9aaaba"/>
  <path d="M55 130 C56 128 59 128 60 130 C61 132 59 134 57 134 C55 134 54 132 55 130Z" fill="#9aaaba"/>
  <path d="M85 128 C86 126 89 126 90 128 C91 130 89 132 87 132 C85 132 84 130 85 128Z" fill="#9aaaba"/>
  <!-- Shadow side -->
  <path d="M96 30 C110 45 118 70 120 100 C122 125 115 142 100 148 L96 148 C108 138 114 120 114 95 C114 70 108 45 96 30Z" fill="url(#pa-sm-dark)"/>
