<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" width="130" height="150">
  <defs>
    <linearGradient id="pa-sm-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a8a9a"/>
      <stop offset="40%" stop-color="#5a6a7a"/>
      <stop offset="100%" stop-color="#3a4a5a"/>
    </linearGradient>
    <linearGradient id="pa-sm-dark" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#2a3a4a" stop-opacity="0"/>
      <stop offset="70%" stop-color="#1a2a3a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1a2a" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="pa-sm-cyan" cx="0.4" cy="0.35" r="0.4">
      <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pa-sm-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9aaa"/>
      <stop offset="50%" stop-color="#6a7a8a"/>
      <stop offset="100%" stop-color="#4a5a6a"/>
    </linearGradient>
    <filter id="pa-sm-brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.4 1.2" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Main shoulder mount housing -->
  <path d="M20 140 C12 115 10 80 18 50 C24 30 38 14 58 8 C78 2 98 8 110 24 C122 40 126 68 122 100 C118 125 110 142 96 148 L38 150 C28 148 22 145 20 140Z" fill="url(#pa-sm-metal)" filter="url(#pa-sm-brush)"/>
