  <!-- Elbow bearing highlight -->
  <path d="M48 95 C52 90 60 88 68 90 C74 92 78 96 80 102 L76 106 C74 100 70 96 64 94 C58 92 52 94 50 98Z" fill="url(#pa-hl-spot)"/>
  <!-- Forearm casing specular -->
