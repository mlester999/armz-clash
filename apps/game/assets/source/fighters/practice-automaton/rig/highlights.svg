<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200">
  <defs>
    <linearGradient id="pa-hl-spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e0f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e0f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pa-hl-spot" cx="0.4" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pa-hl-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Shoulder specular -->
  <path d="M30 15 C40 8 55 5 70 8 C80 10 88 16 92 24 L88 30 C82 22 72 16 60 14 C48 12 38 15 32 22Z" fill="url(#pa-hl-spec)"/>
