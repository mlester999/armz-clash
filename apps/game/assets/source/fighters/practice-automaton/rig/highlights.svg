  <!-- Wrist assembly highlight -->
  <path d="M40 168 C44 165 52 164 60 166 L58 172 C52 170 46 170 42 172Z" fill="url(#pa-hl-spot)" fill-opacity="0.7"/>
  <!-- Hand chassis specular -->
  <path d="M35 175 C40 172 50 170 60 172 C68 174 74 178 78 184 L74 188 C70 182 64 178 56 176 C48 174 40 176 37 180Z" fill="url(#pa-hl-spec)" fill-opacity="0.5"/>
