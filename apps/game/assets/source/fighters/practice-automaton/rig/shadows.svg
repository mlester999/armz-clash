      <stop offset="0%" stop-color="#0a1520" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0a1520" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#060d14" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="pa-sh-joint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0a1520" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pa-sh-under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060d14" stop-opacity="0.5"/>
