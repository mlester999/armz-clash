name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Environment check
        run: pnpm env:check

      - name: Database static validation
        run: pnpm db:validate

      - name: Secrets scan
        run: pnpm secrets:scan

      - name: Build
        run: pnpm build

      - name: Client-bundle secret audit
        run: pnpm audit:client-bundles

      # Hosted Supabase migrations and RLS probes are intentionally NOT run in CI.
      # They require owner-approved credentials and SUPABASE_REMOTE_WRITES_APPROVED.

  e2e:
    name: Playwright foundation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run foundation E2E
        run: pnpm test:e2e
        env:
          CI: true
          # Deterministic local host for all Playwright webServers.
          # CI foundation job does not inject owner Reown / Supabase secrets.
          # Wallet-modal deep tests require repository secrets (owner-approved).
          # Non-secret CI-only signing material so the API process can boot;
          # these are not production credentials and have no hosted DB.
          ARMZ_ENVIRONMENT: development
          ARMZ_SESSION_SIGNING_SECRET: ci-e2e-session-signing-secret-not-for-production
          ARMZ_WALLET_NONCE_SECRET: ci-e2e-wallet-nonce-secret-not-for-production
          ARMZ_REQUEST_METADATA_SECRET: ci-e2e-request-metadata-secret-not-for-production
          ARMZ_MAINNET_ENABLED: 'false'
          ARMZ_REAL_MINT_ENABLED: 'false'
          ARMZ_REAL_REWARDS_ENABLED: 'false'
          ARMZ_CLAIMS_ENABLED: 'false'
          ARMZ_MARKETPLACE_ENABLED: 'false'
          ARMZ_MARKETPLACE_SETTLEMENT_ENABLED: 'false'
          ARMZ_ORACLE_ENABLED: 'false'
          ARMZ_ADMIN_ECONOMY_WRITES_ENABLED: 'false'
          ARMZ_DEMO_MODE_ENABLED: 'true'
          NEXT_PUBLIC_ARMZ_NETWORK: devnet
          NEXT_PUBLIC_ARMZ_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_ARMZ_WEB_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ARMZ_GAME_URL: http://127.0.0.1:3001
          # Optional: set repository secret NEXT_PUBLIC_REOWN_PROJECT_ID to exercise
          # configured wallet chrome. Without it, foundation asserts safe unconfigured state.
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
